spring.profiles.active=local

server.port=8080
logging.level.io.milton=DEBUG
logging.level.org.webdav=DEBUG
logging.level.org.example=DEBUG
logging.level.org.nzbstreamer.transformers=DEBUG

# Usenet Configuration
usenet.server=YOUR_USENET_SERVER
usenet.port=119
# Connections to the news server. The provider gives a maximum.
usenet.pool-size=40
usenet.username=YOUR_USENET_USERNAME
usenet.password=YOUR_USENET_PASSWORD

# Database Configuration
spring.datasource.url=YOUR_DB_URL
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Download worker
download.worker.min-buffer-size=4
download.worker.max-retries=3
download.worker.buffer-full-sleep-ms=10

